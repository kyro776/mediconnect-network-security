limit_req_zone $binary_remote_addr zone=medecin:10m rate=10r/m;
limit_req_status 429;

server {
    listen 10.1.10.10:443 ssl;
    server_name portail.mediconnect.local;
    server_tokens off;

    ssl_certificate     /etc/ssl/certs/portail.crt;
    ssl_certificate_key /etc/ssl/private/portail.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64k;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:" always;

    location /medecin {
        limit_req zone=medecin burst=10 nodelay;
        proxy_pass http://10.1.10.20:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        proxy_pass http://10.1.10.20:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
